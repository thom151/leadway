name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'

      - name: Build app
        run: |
          chmod +x ./scripts/buildprod.sh
          ./scripts/buildprod.sh

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Use gcloud CLI
        run: gcloud info

      - name: Build and push Docker image
        run: gcloud builds submit --tag australia-southeast2-docker.pkg.dev/leadway-42314/leadway-ar-repo/leadway:latest .

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Run migrations
        run: |
          chmod +x ./scripts/migrateup.sh
          ./scripts/migrateup.sh


      - name: Deploy to Cloud run
        run: gcloud run deploy leadway --image australia-southeast2-docker.pkg.dev/leadway-42314/leadway-ar-repo/leadway:latest --region  australia-southeast2 --allow-unauthenticated --project  leadway-42314 --max-instances=4
