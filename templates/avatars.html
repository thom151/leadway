{{ define "title" }}Home Page{{ end }}
{{define "stylesheet"}}
   
{{end}}
{{ define "content" }}
{{if .Data.AvatarList}}
        {{range .Data.AvatarList}}
            <video class="video-player" value="{{.AvatarID}}" controls style="display: block;" src="{{.PreviewVideoURL}}"></video>
            <a href="/api/series/{{.AvatarID}}" class="select-avatar-button">Select Video</a>
        {{end}}
{{ else }}
    <p>No avatars availabe. Please try again later.</p>
{{end}}

   
{{ end }}
